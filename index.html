<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Legal Docs</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1c1c1a;
    --muted: #5b5b56;
    --accent: #1f7a6c;
    --border: #e3e1da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --surface: #1f2224;
      --text: #ecece8;
      --muted: #a8a8a2;
      --accent: #4fc2b7;
      --border: #33363a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 44px;
    max-width: 420px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  ul { padding-left: 20px; margin: 0; }
  li { margin-bottom: 8px; }
  a { color: var(--accent); }
  p.muted { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1>App legal documents</h1>
    <ul>
      <li><a href="docurio-privacy.html">Docurio — Privacy Policy</a></li>
    </ul>
    <p class="muted">Nubero's policy will be added here once published.</p>
  </div>
</body>
</html>
